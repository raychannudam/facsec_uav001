services:
  pgdb_facsec:
    container_name: pgdb_facsec
    image: postgres:18
    restart: always
    ports:
      - 5433:5432
    volumes:
      - ./databases/data:/var/lib/postgresql
    environment:
      POSTGRES_USER: pgsql_user
      POSTGRES_PASSWORD: pgsql_password

  backend_facsec:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: backend_facsec
    restart: always
    volumes:
      - ./backend/mosquitto/config/mosquitto.conf:/app/mosquitto/config/mosquitto.conf
      - ./backend/mosquitto/config/pwfile:/app/mosquitto/config/pwfile
      - ./backend/mosquitto/config/aclfile:/app/mosquitto/config/aclfile
      - ./backend/mosquitto/log:/app/mosquitto/log
      - ./backend/mosquitto/log/notice.log:/app/mosquitto/log/notice.log
      - ./backend:/app
    ports:
      - 8001:8000
      - 9002:9001
      - 8884:8883
    depends_on:
      - pgdb_facsec

  frontend_facsec:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: frontend_facsec
    ports:
      - "8081:80"
    restart: always
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf

  mediamtx_facsec:
    image: bluenviron/mediamtx
    container_name: mediamtx_facsec
    restart: always
    ports:
      - 8554:8554
      - 1935:1935
      - 8888:8888
      - 8889:8889
      - 8890:8890/udp
      - 8189:8189/udp
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/recordings:/recordings
    depends_on:
      - backend_facsec

  influxdb_facsec:
    image: influxdb:2.7
    container_name: influxdb_facsec
    ports:
      - "8087:8086"   # InfluxDB API
    environment:
      # Set up initial credentials
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpass
      DOCKER_INFLUXDB_INIT_ORG: drtech
      DOCKER_INFLUXDB_INIT_BUCKET: drsys
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    restart: always

  telegraf_facsec:
    image: telegraf:1.31
    container_name: telegraf_facsec
    depends_on:
      - backend_facsec
      - influxdb_facsec
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: always

  ollama_facsec:
    image: ollama/ollama
    container_name: ollama_facsec
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    restart: always

  # streaming_facsec:
